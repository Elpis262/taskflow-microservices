server:
  port: 8086  
spring:
  application:
    name: comment-service  
  datasource:
    url: jdbc:postgresql://localhost:5436/comment_db  
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/